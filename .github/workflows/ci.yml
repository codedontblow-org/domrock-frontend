name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24, o mesmo da imagem usada no docker-compose (node:24-alpine)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instala dependencias
        run: npm ci

      - name: Checagem de tipos
        run: npm run type-check

      - name: Testes
        run: npx vitest run

  build:
    name: Build de producao
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instala dependencias
        run: npm ci

      # O front nao tem Dockerfile (no compose roda na imagem node); o build garante que o
      # bundle de producao gera sem erro.
      - name: Build
        run: npm run build-only
